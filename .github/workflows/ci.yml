name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node-version }}
          # v0.2.1：引入 ajv / ajv-formats（devDependencies，仅 ACS Schema conformance 使用）；
          # 其余运行链仍零依赖。安装 devDeps 后官方 JSON Schema 校验才能作为 Release Gate（§五十三）。

      - name: Install dev dependencies (ajv, for ACS v0.1.0 schema conformance)
        run: npm ci --no-audit --no-fund

      - name: Show versions
        run: node --version && npm --version

      - name: Check D0-D4 compatibility docs have not drifted
        run: node scripts/check-compatibility-docs.ts

      # 决策账本防漂移（2026-09-17）：每个已发布版本都必须在 docs/decisions.md 的 A 表里有一行。
      # 手工维护的表没有机器校验就一定会腐烂 —— 这正是本项目反复吃的「文档说 A、实际是 B」。
      - name: Verify the decisions log covers every released version
        run: node scripts/check-decisions-log.ts

      - name: Verify ACS v0.1.0 vendor schema snapshot integrity (§五十四/§五十六)
        run: node scripts/verify-acs-schema-snapshot.ts

      - name: Build release artifact (portable runtime)
        run: node scripts/build-release.ts

      - name: Run platform-independent test suites
        run: node --test packages/core/test/*.test.ts packages/trash/test/*.test.ts packages/installer/test/*.test.ts packages/codex/test/*.test.ts packages/dsh/test/*.test.ts packages/acs/test/*.test.ts tests/e2e/*.test.ts tests/adapter/*.test.ts tests/adversarial/*.test.ts tests/product/*.test.ts tests/release-hardening/*.test.ts tests/transaction/*.test.ts tests/distribution/*.test.ts tests/acs/*.test.ts tests/compatibility/*.test.ts tests/conformance/*.test.ts tests/acs-schema-conformance/*.test.ts

      - name: Verify generated agent security matrix is up to date
        run: node scripts/generate-agent-security-matrix.ts --check

      - name: Verify release artifact checksums
        run: |
          ART="$(ls -d dist/agent-risk-guard-v* 2>/dev/null | head -1)"
          if [ -z "$ART" ] || [ ! -d "$ART" ]; then echo "artifact dir not found"; exit 1; fi
          cd "$ART" && sha256sum -c SHA256SUMS.txt

  # 回收站 D3 实测仍只在 Windows + 本机环境可跑，保持本地 test-all.ps1；
  # 但 hook 判定回归已全部进 CI：sh 四套（下方 sh-hook）+ ps1 五套（下方 ps1-hook）。

  # sh（Linux/macOS）hook 跨平台验证：GitHub macOS runner 即真 Mac（BSD 工具链），
  # Ubuntu runner 覆盖 GNU 工具链；2026-09-10 起把 WSL/Git Bash 本地实测固化为 CI。
  sh-hook:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Show environment
        run: |
          uname -a
          bash --version | head -1
          python3 --version
          git --version

      # 防御：Windows 作者环境的文件可能在 git 中无执行位（100644）；
      # checkout 后显式加回，保证 "$HOOK" 直接执行（shebang）可用。
      - name: Ensure hook and suites are executable
        run: |
          chmod +x skills/agent-risk-guard/scripts/dangerous-commands.sh
          chmod +x skills/agent-risk-guard/tests/sh-hook-test.sh
          chmod +x skills/agent-risk-guard/tests/sh-audit-edge.sh
          chmod +x skills/agent-risk-guard/tests/sh-audit-bypass.sh
          chmod +x skills/agent-risk-guard/tests/sh-failclosed-test.sh

      - name: bash syntax check for hook and suites
        run: |
          bash -n skills/agent-risk-guard/scripts/dangerous-commands.sh
          bash -n skills/agent-risk-guard/tests/sh-hook-test.sh
          bash -n skills/agent-risk-guard/tests/sh-audit-edge.sh
          bash -n skills/agent-risk-guard/tests/sh-audit-bypass.sh
          bash -n skills/agent-risk-guard/tests/sh-failclosed-test.sh

      - name: Run sh hook suite 1 (main rules)
        run: bash skills/agent-risk-guard/tests/sh-hook-test.sh skills/agent-risk-guard/scripts/dangerous-commands.sh

      - name: Run sh hook suite 2 (edge audit)
        run: bash skills/agent-risk-guard/tests/sh-audit-edge.sh skills/agent-risk-guard/scripts/dangerous-commands.sh

      - name: Run sh hook suite 3 (bypass / false-positive audit)
        run: bash skills/agent-risk-guard/tests/sh-audit-bypass.sh skills/agent-risk-guard/scripts/dangerous-commands.sh

      # 2026-09-13 补：G5 的 fail-closed 套件此前**不在 CI**（只在本机 WSL 跑过）。
      - name: Run sh hook suite 4 (fail-closed semantics / JSON validity)
        run: bash skills/agent-risk-guard/tests/sh-failclosed-test.sh skills/agent-risk-guard/scripts/dangerous-commands.sh

  # ── ps1 hook 判定回归 + agy 适配器（6 套 × 双引擎）───────────────────────────────
  # 2026-09-13 补：此前 ps1 五套**完全不在 CI**，只在本地 `test-all.ps1` 里跑 ——
  # 正是 R10 的第 2 条假象「闸门存在 ≠ 闸门被执行」。windows-latest 自带
  # powershell.exe(5.1) 与 pwsh(7)，与本机本地双引擎口径一致。
  # 套件取自仓库内 `skills/agent-risk-guard/tests/`（自定位到 `../scripts/` 的 hook），
  # 与本地 test-all.ps1 用的是同一份、同一位置（改动前本地指向仓库外的 audit 树，CI 拿不到）。
  #
  # 2026-09-21：**D9 已闭环** —— tests/ 下的 ps1 套件全部补了 UTF-8 BOM，于是
  # PS 5.1 与 pwsh 7 连**条数**也一致了（此前 `hook-bypass-regression` 是 18/18 vs 20/20：
  # 无 BOM 时 5.1 按 ANSI/GBK 读中文把字符串截断）。因此本 job 从「只断言退出码」
  # 升级为「退出码 + 双引擎条数必须相同」—— 引擎差异不再有豁免。
  # 同批加入 `agy-hook-test`：agy 适配器的接口与其它套件不同（stdin protojson → stdout JSON、
  # 退出码恒 0），所以它是独立一套，且额外断言协议面与输出编码。
  ps1-hook:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Show environment
        shell: pwsh
        run: |
          Write-Host "pwsh       : $($PSVersionTable.PSVersion)"
          & powershell -NoProfile -Command '"powershell : " + $PSVersionTable.PSVersion.ToString()'

      - name: Run ps1 hook + agy adapter suites (both engines, counts must agree)
        shell: pwsh
        run: |
          $suites = @('hook-rules-test','hook-bypass-regression','hook-fp-regression','hook-audit-reregress','hook-redact-test','agy-hook-test')
          $summary = @{}
          $failed = @()
          foreach ($eng in @('powershell','pwsh')) {
            foreach ($s in $suites) {
              Write-Host "=== $s ($eng) ==="
              $out = & $eng -NoProfile -ExecutionPolicy Bypass -File "skills/agent-risk-guard/tests/$s.ps1" 2>&1
              $code = $LASTEXITCODE
              $out | ForEach-Object { Write-Host $_ }
              $last = ($out | Where-Object { $_ -match 'PASS:|^[0-9]+/[0-9]+$' } | Select-Object -Last 1)
              Write-Host "exit=$code summary=$last"
              $summary["$eng/$s"] = [string]$last
              if ($code -ne 0) { $failed += "$s($eng)" }
            }
          }
          foreach ($s in $suites) {
            $a = $summary["powershell/$s"]; $b = $summary["pwsh/$s"]
            if ($a -ne $b) { $failed += "$s 双引擎条数不一致（PS5.1=$a / pwsh=$b）" }
          }
          if ($failed.Count -gt 0) { Write-Host "FAILED: $($failed -join '; ')"; exit 1 }
          Write-Host "ps1 + agy suites: 6/6 green on both engines, counts identical"

  # 决策账本：代码变更必须同时更新 docs/decisions.md。
  # check-decisions-log.ts 只管 A 表（已发布版本），管不到未发布的切片 —— PR #4 就是这么漏掉的。
  # 本作业补上另一半，只在 PR 上跑。
  decisions-row:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0          # 需要与 base 分支做 diff
      - name: Require a decisions.md row for code changes
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node scripts/check-decisions-row.mjs